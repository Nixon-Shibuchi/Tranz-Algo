services:
  db:
    image: postgres:16
    container_name: tranzalgo-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: tranzalgo
      POSTGRES_USER: tranzalgo
      POSTGRES_PASSWORD: tranzalgo
    volumes:
      - tranzalgo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tranzalgo -d tranzalgo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tranzalgo_pgdata:
